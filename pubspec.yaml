name: sahmi
description: سهمي - تطبيق محاكاة تداول (Demo mode)
publish_to: none
version: 0.4.3+7
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  supabase_flutter: ^2.5.6
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.20.3
  url_launcher: ^6.3.0
  fl_chart: ^0.69.0
  share_plus: ^10.0.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0A0E27"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  remove_alpha_ios: true
